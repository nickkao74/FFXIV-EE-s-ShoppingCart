<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EE · 製作輔助工具 — EE的FFXIV購物車</title>
<link rel="stylesheet" href="assets/css/main.css?v=16">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🛒</text></svg>">
<script src="assets/js/gate.js?v=4"></script>
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html"><span class="mark">EE</span>EE的FFXIV購物車</a>
    <div class="header-sub">製作輔助工具</div>
    <nav class="header-nav">
      <a href="ee-orders.html">EE 列表</a>
      <a href="ee-stock.html">素材庫存</a>
      <a href="order.html">點單者</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <div class="page-head">
    <h1>裝備清單</h1>
    <p>典禮系列 · 裝備等級 740 ｜ 點「加入購物車」把要做的裝備丟進去，再到素材總計頁確認要收哪些東西。</p>
  </div>

  <div class="filters" id="filters"></div>

  <div class="result-bar">
    顯示 <span class="count" id="count">0</span> 件裝備
    <span id="filter-note"></span>
  </div>

  <div class="item-list" id="list"></div>
</main>

<script src="assets/js/data.js?v=4"></script>
<script src="assets/js/app.js?v=9"></script>
<script>
FFAPI.ready(function () {
  var cart = new FF.Cart('ffxiv_cart_ee');
  var listEl = document.getElementById('list');
  var countEl = document.getElementById('count');

  var fb = new FF.FilterBar(document.getElementById('filters'), { onChange: function () { bulk.update(); draw(); } });
  var bulk = FF.mountBulkSetButton(document.querySelector('.result-bar'), fb, cart);

  function draw() {
    var items = fb.apply(FF.D.items);
    countEl.textContent = items.length;
    FF.renderList(listEl, items, cart, { showMats: true });
  }

  cart.on(draw);

  new FF.FloatingCart(cart, {
    buttons: [
      {
        label: '📋 查看素材總計',
        cls: 'btn-primary',
        onClick: function () { location.href = 'ee-materials.html'; }
      }
    ]
  });

  draw();

  if (!cart.isEmpty()) {
    FF.toast('已還原購物車（' + cart.count() + ' 件）');
  }
});
</script>

</body>
</html>
